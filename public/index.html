<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#667eea" />
    <meta
      name="description"
      content="Joyeux Anniversaire Maman AHLEM ❤️"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Joyeux Anniversaire AHLEM 🎂</title>
    <style>
      /* Préchargement - Écran de chargement élégant */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .loader {
        text-align: center;
      }
      
      .loader-heart {
        font-size: 4rem;
        animation: heartbeat 1s infinite;
      }
      
      @keyframes heartbeat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.2); }
      }
      
      .loader-text {
        color: white;
        font-size: 1.5rem;
        margin-top: 20px;
        font-family: 'Segoe UI', Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <noscript>Vous devez activer JavaScript pour voir cette page.</noscript>
    <div id="loading-screen">
      <div class="loader">
        <div class="loader-heart">❤️</div>
        <div class="loader-text">Chargement de ta surprise...</div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Masquer l'écran de chargement une fois que React est prêt
      window.addEventListener('load', function() {
        setTimeout(function() {
          document.getElementById('loading-screen').classList.add('hidden');
        }, 1000);
      });
    </script>
  </body>
</html>
